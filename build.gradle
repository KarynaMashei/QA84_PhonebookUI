plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.seleniumhq.selenium:selenium-java:4.40.0'
    implementation 'org.testng:testng:7.11.0'
    implementation 'io.github.bonigarcia:webdrivermanager:6.3.4'
    implementation 'ch.qos.logback:logback-classic:1.6.3'
}

test {
    useTestNG()
}

task qa(type: Test) {
    useTestNG()

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    def selectedBrowser = project.findProperty("browser") ?: "chrome"
    inputs.property("browser", selectedBrowser)
    systemProperty "browser", selectedBrowser
}
def registerTask(String taskName, String suitePath) {
    tasks.register(taskName, Test) {
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath

        useTestNG() {
            suites suitePath
        }

        def selectedBrowser = project.findProperty("browser") ?: "chrome"
        inputs.property("browser", selectedBrowser)
        systemProperty "browser", selectedBrowser
    }
}

registerTask('quick', 'src/test/resources/quick.xml')
registerTask('regr', 'src/test/resources/regression.xml')